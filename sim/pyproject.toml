[project]
name = "grmln-override-sim"
version = "0.1.0"
description = "MuJoCo university Override field and route experiments"
requires-python = ">=3.12"
dependencies = ["mujoco==3.17.0", "numpy>=2,<3", "pillow>=11", "imageio>=2.36", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
cad = ["cadquery==2.8.0", "trimesh>=4", "fast-simplification==0.2.0", "rtree==1.4.1"]
test = ["pytest>=8"]

[project.scripts]
override-sim = "override_sim.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["override_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
override_sim = ["assets/cad/*.json", "assets/cad/meshes/*.obj"]
